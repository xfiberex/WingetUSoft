# Análisis estático de seguridad (CodeQL) sobre el C#.
#
# Importa en esta app más que en la media: descarga instaladores, los ejecuta, habla con un worker elevado
# por named pipe y borra carpetas de forma recursiva al limpiar residuos (ver SECURITY.md). Los hallazgos
# aparecen en Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar C#
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # Compilación real y no build-mode none: el código generado por el compilador XAML de WinUI solo
          # existe tras compilar, y sin él CodeQL no ve los manejadores enlazados desde el XAML.
          build-mode: manual
          # security-extended y no security-and-quality: la primera ejecución (2026-09-17) con esta última dio 374
          # alertas, ninguna con severidad de seguridad y 142 en código generado por el compilador XAML. Con
          # tanto ruido, una alerta de seguridad real pasaría desapercibida en Security → Code scanning.
          queries: security-extended

      - name: Compilar
        shell: pwsh
        run: dotnet build WingetUSoft.slnx -c Release

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
